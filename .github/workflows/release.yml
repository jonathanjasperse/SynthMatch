name: Release

# Builds both installers. On a version tag (git tag v0.2.0 && git push --tags)
# they are attached to a draft GitHub release; run it by hand from the Actions
# tab to get them as downloadable artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          else v="$(sed -n 's/^project(SynthMatch VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\SynthMatch.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

  macos:
    name: macOS installer
    runs-on: macos-latest
    env:
      # Optional. Without these the installer is unsigned (see the README).
      APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
      INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          else v="$(sed -n 's/^project(SynthMatch VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Import signing certificates
        if: env.CERTIFICATES_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -P "$CERTIFICATES_PASSWORD" -A -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Build (universal)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build the installer
        run: packaging/macos/build-pkg.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.pkg

  publish:
    name: Draft release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "SynthMatch ${GITHUB_REF_NAME#v}"
