name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push cancels the run for the older one. macOS minutes are billed at
# 10x on private repos, so don't spend them on outdated commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: SynthMatch-${{ runner.os }}
          path: |
            build/plugin/SynthMatch_artefacts/Release/VST3
            build/plugin/SynthMatch_artefacts/Release/AU
          if-no-files-found: warn

  # The engine has no JUCE dependency, so it also builds on Linux, where the
  # dataset generation and training will eventually run.
  engine-linux:
    name: Engine (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSYNTHMATCH_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
